<div class="login-container">

  <div class="login-card">

    <h1>Team Daily Work Scheduler</h1>

    <h2>Login</h2>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit">
        Login
      </button>

    </form>

    @if (errorMessage) {
      <p class="error-message">
        {{ errorMessage }}
      </p>
    }

  </div>

</div>
